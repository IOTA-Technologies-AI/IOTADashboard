name: Secret scan

# Second line of defence behind GitHub push protection.
#
# A production ZATCA signing key and a .env with four live credentials reached
# this organisation's history because nothing looked. Push protection blocks
# known provider patterns at push time; gitleaks catches the rest, including
# the full history on a schedule.
#
# NOTE: this runs the gitleaks CLI directly rather than gitleaks/gitleaks-action.
# The CLI is MIT-licensed and free; the Action wrapper refuses to run on
# organisation repositories without a paid licence key, and fails without ever
# scanning — which looks identical to a clean result.
#
# SOC 2 CC6.1 · ISO 27001 A.8.24 (key management), A.8.28 (secure coding).

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    # Weekly full-history sweep — catches anything predating this workflow.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the scheduled sweep; the diff is enough otherwise.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # --redact keeps any match out of the build log. A CI log is not a safe
      # place to print the secret you just found.
      - name: Scan working tree
        run: gitleaks dir . --redact --verbose --exit-code 1

      - name: Scan full history
        if: github.event_name == 'schedule'
        run: gitleaks git . --redact --verbose --exit-code 1
