name: Secret scan

# Second line of defence behind GitHub push protection.
#
# A production ZATCA signing key and a .env with four live credentials reached
# this organisation's history because nothing looked. Push protection blocks
# known provider patterns at push time; gitleaks catches the rest, including
# the full history on a schedule.
#
# SOC 2 CC6.1 · ISO 27001 A.8.24 (key management), A.8.28 (secure coding).

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    # Weekly full-history sweep — catches anything that predates this workflow.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on the scheduled run; PRs only need the diff.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
