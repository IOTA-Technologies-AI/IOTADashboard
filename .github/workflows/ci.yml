name: CI

# Change-management gate for the dashboard.
#
# SOC 2 CC8.1 and ISO 27001 A.8.32 both ask you to show that changes were
# reviewed and tested before release. This workflow, plus branch protection
# requiring it to pass, is the evidence for that — an auditor samples changes
# and looks for a recorded gate on each one.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-js

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: next-js/yarn.lock

      # yarn, not npm: package.json declares packageManager yarn@1.22.22 and
      # yarn.lock is the maintained lockfile. package-lock.json is a stale
      # artifact (last updated two months before yarn.lock) and should be
      # deleted — `npm ci` against it fails on drift.
      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn fm:check

      # The real gate. A build failure is how we catch undefined references and
      # broken imports in a codebase without type checking.
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
